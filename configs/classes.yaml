# 11 classes of the AIInAction RoboTaxi competition.
# Order and ids are FIXED (labels, data.yaml and model output must all use them).
# Source: hackathon-l2-docs/docs/labeling_guideline.md, data/sample_data/data.yaml
nc: 11
names:
  0: Car
  1: Bus
  2: Truck
  3: Other vehicle
  4: Motorcycle
  5: Motorcyclist
  6: Bicycle
  7: Cyclist
  8: Pedestrian
  9: Sign
  10: Traffic light
names_vi:
  0: Ô tô con
  1: Xe buýt / xe khách
  2: Xe tải
  3: Phương tiện khác
  4: Xe máy (không người)
  5: Xe máy (có người)
  6: Xe đạp (không người)
  7: Xe đạp (có người)
  8: Người đi bộ
  9: Biển báo
  10: Đèn giao thông

# Competition constants (from the official notebook, for local QA scripts)
team_id: 61
imgsz: 640
min_gt_area_px: 64          # GT smaller than this (at 640 scale) is ignored by the scorer
min_gt_per_class_val: 10    # val must contain >= 10 instances of every class
min_short_side_ratio: 0.0125  # guideline: skip objects whose short side < 1.25% of the image long side
max_det: 100
